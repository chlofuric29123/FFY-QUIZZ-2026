<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Direct Clémence — FFY</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><div class="hero"><div class="big">📊⚡</div><h1>FFY — Direct</h1><p>Résultats question par question</p></div>
<section id="lock" class="card"><div class="center"><div class="big">🔐</div><h2>Accès Clémence</h2></div><input id="pin" type="password" placeholder="Code d'accès"><button id="unlock" class="primary" style="width:100%;margin-top:12px">Ouvrir le direct</button></section>
<section id="live" class="card hidden"><div id="summary"></div><div id="results"></div></section></div>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script><script src="firebase-config.js"></script><script src="data.js"></script>
<script>
const LIVE_PIN='clemence2026';const {questions}=window.QUIZ_DATA;firebase.initializeApp(window.FIREBASE_CONFIG);const db=firebase.database();const el=id=>document.getElementById(id);
el('unlock').onclick=()=>{if(el('pin').value!==LIVE_PIN){alert('Code incorrect');return}el('lock').classList.add('hidden');el('live').classList.remove('hidden');db.ref('ffy2026/submissions').on('value',s=>render(s.val()||{}))};
function render(subs){const arr=Object.values(subs||{});const started=arr.filter(s=>s.answers&&Object.keys(s.answers).length>0).length;const completed=arr.filter(s=>s.completed===true).length;el('summary').innerHTML=`<h2>${started} participant${started>1?'s':''} en cours · ${completed} terminé${completed>1?'s':''}</h2><p class="note">🟢 Mise à jour immédiate à chaque clic</p>`;let html='';questions.forEach((q,qi)=>{const counts={};let answered=0;arr.forEach(s=>{const a=s.answers?.[qi];if(a){counts[a]=(counts[a]||0)+1;answered++}});const ranked=Object.entries(counts).sort((a,b)=>b[1]-a[1]);html+=`<div class="result-card"><h3>${qi+1}. ${q.text}</h3><div class="small">${answered} réponse${answered>1?'s':''} reçue${answered>1?'s':''}</div>`;if(!ranked.length)html+='<div class="small" style="margin-top:8px">Pas encore de vote.</div>';ranked.forEach(([name,c])=>{const pct=answered?Math.round(c/answered*100):0;html+=`<div class="row"><span>${name}</span><strong>${c} · ${pct}%</strong></div><div class="bar"><span style="width:${pct}%"></span></div>`});html+='</div>'});el('results').innerHTML=html}
</script></body></html>

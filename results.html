<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Résultats finaux — FFY</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><div class="hero"><div class="big">🏆🎉</div><h1>Résultats FFY</h1><p>Résultats finaux</p></div><section class="card"><div id="gate"></div><div id="summary"></div><div id="results"></div><div class="center" style="margin-top:20px"><a href="index.html">← Retour au questionnaire</a></div></section></div>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script><script src="firebase-config.js"></script><script src="data.js"></script>
<script>
const {questions}=window.QUIZ_DATA;const allowed=localStorage.getItem('ffy_completed')==='true';firebase.initializeApp(window.FIREBASE_CONFIG);const db=firebase.database();const el=id=>document.getElementById(id);
if(!allowed){el('gate').innerHTML='<div class="center"><div class="big">🔒</div><h2>Termine d’abord le quiz</h2><p class="note">Les participants voient les résultats seulement après avoir terminé.</p><a class="btn primary" href="index.html" style="display:block;margin-top:16px">Retour au quiz</a></div>'}else{el('gate').classList.add('hidden');db.ref('ffy2026/submissions').on('value',s=>render(s.val()||{}))}


function render(subs){
  const arr=Object.values(subs||{}).filter(s=>s.completed===true);
  const n=arr.length;

  el('summary').innerHTML=`<h2>${n} participant${n>1?'s':''} a${n>1?'ont':' '} terminé</h2>
    <p class="note">Les résultats détaillés sont suivis des grands Awards FFY.</p>`;

  let detail='';

  questions.forEach((q,qi)=>{
    const counts={};
    arr.forEach(s=>{
      const a=s.answers?.[qi];
      if(a) counts[a]=(counts[a]||0)+1;
    });

    const ranked=Object.entries(counts).sort((a,b)=>b[1]-a[1]);

    detail+=`<div class="result-card"><h3>${qi+1}. ${q.text}</h3>`;
    if(!ranked.length){
      detail+=`<div class="small">Pas encore de résultat final.</div>`;
    } else {
      ranked.forEach(([name,c])=>{
        const pct=n?Math.round(c/n*100):0;
        detail+=`<div class="row"><span>${name}</span><strong>${c} · ${pct}%</strong></div>
                 <div class="bar"><span style="width:${pct}%"></span></div>`;
      });
    }
    detail+='</div>';
  });

  // Les grandes catégories FFY.
  // Chaque nombre correspond à l'index d'une question (0 = question 1).
  const awardDefs=[
    {
      icon:"🥂",
      title:"Le/la plus gros(se) fêtard(e)",
      qs:[1,3,9,16,25,26,37]
    },
    {
      icon:"⏰",
      title:"Le/la plus chaotique",
      qs:[0,6,13,23,40]
    },
    {
      icon:"😂",
      title:"La pile électrique du groupe",
      qs:[15,17,36,39]
    },
    {
      icon:"😈",
      title:"Le/la plus dangereux(se) en soirée",
      qs:[5,8,18,19,26,27]
    },
    {
      icon:"❤️",
      title:"Le/la plus love",
      qs:[28,29,30,41]
    },
    {
      icon:"👴",
      title:"Le/la daron/maman du groupe",
      qs:[10,11,12,24,31]
    },
    {
      icon:"🌍",
      title:"L’aventurier/ère FFY",
      qs:[32,33,35,40]
    }
  ];

  function winnersForQuestions(questionIndexes){
    const scores={};
    arr.forEach(s=>{
      questionIndexes.forEach(qi=>{
        const a=s.answers?.[qi];
        if(a) scores[a]=(scores[a]||0)+1;
      });
    });

    const ranked=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
    if(!ranked.length) return {winners:[],score:0,total:0};

    const max=ranked[0][1];
    const winners=ranked.filter(([_,score])=>score===max).map(([name])=>name);
    const total=ranked.reduce((sum,[_,score])=>sum+score,0);

    return {winners,score:max,total};
  }

  let awardsHtml=`<div style="margin-top:34px">
    <div class="center">
      <div class="big">🏆</div>
      <h2>LES AWARDS FFY</h2>
      <p class="note">Les grands profils du groupe, calculés à partir de plusieurs questions.</p>
    </div>`;

  awardDefs.forEach(a=>{
    const r=winnersForQuestions(a.qs);
    const pct=r.total?Math.round(r.score/r.total*100):0;

    awardsHtml+=`<div class="result-card" style="padding:20px">
      <div style="font-size:34px">${a.icon}</div>
      <h3 style="font-size:21px;margin-top:8px">${a.title}</h3>`;

    if(!r.winners.length){
      awardsHtml+=`<div class="small">Pas encore de gagnant.</div>`;
    }else{
      awardsHtml+=`<div style="font-size:26px;font-weight:900;margin-top:10px">
        ${r.winners.join(" & ")}
      </div>
      <div class="small" style="margin-top:7px">${pct}% des nominations de cette catégorie</div>`;
    }

    awardsHtml+=`</div>`;
  });

  // Grand prix : personne la plus souvent nommée sur l'ensemble du questionnaire.
  // La question 39 (blague avec Julien comme seule réponse) est exclue pour ne pas fausser le classement.
  const globalScores={};
  arr.forEach(s=>{
    questions.forEach((_,qi)=>{
      if(qi===38) return;
      const a=s.answers?.[qi];
      if(a) globalScores[a]=(globalScores[a]||0)+1;
    });
  });

  const globalRanked=Object.entries(globalScores).sort((a,b)=>b[1]-a[1]);

  awardsHtml+=`<div class="result-card" style="padding:24px;text-align:center;margin-top:18px">
    <div style="font-size:52px">🏆</div>
    <h2 style="margin:6px 0">LA LÉGENDE FFY</h2>`;

  if(!globalRanked.length){
    awardsHtml+=`<div class="small">Pas encore de gagnant.</div>`;
  }else{
    const max=globalRanked[0][1];
    const legends=globalRanked.filter(([_,score])=>score===max).map(([name])=>name);
    awardsHtml+=`<div style="font-size:30px;font-weight:900;margin-top:12px">${legends.join(" & ")}</div>
      <p class="note">La personne la plus souvent citée sur l’ensemble du questionnaire.</p>`;
  }

  awardsHtml+=`</div></div>`;

  el('results').innerHTML=detail+awardsHtml;
}

</script></body></html>

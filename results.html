<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Résultats finaux — FFY</title>
<link rel="stylesheet" href="style.css">
<style>
.awards-wrap{margin-bottom:34px}
.award-card{padding:20px;text-align:center}
.award-winner{font-size:26px;font-weight:900;margin-top:10px}
.legend-card{padding:24px;text-align:center;margin-top:18px}
.legend-winner{font-size:30px;font-weight:900;margin-top:12px}
.separator{height:1px;background:rgba(255,255,255,.10);margin:34px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="big">🏆🎉</div>
    <h1>Résultats FFY</h1>
    <p>Le palmarès final</p>
  </div>

  <section class="card">
    <div id="gate"></div>
    <div id="content" class="hidden">
      <div id="summary"></div>
      <div id="awards"></div>
      <div class="separator"></div>
      <h2>📊 Détail des questions</h2>
      <p class="note">Les votes question par question.</p>
      <div id="details"></div>
      <div class="center" style="margin-top:24px">
        <a href="index.html">← Retour au questionnaire</a>
      </div>
    </div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="data.js"></script>
<script>
const {questions}=window.QUIZ_DATA;
const allowed=localStorage.getItem('ffy_completed')==='true';
firebase.initializeApp(window.FIREBASE_CONFIG);
const db=firebase.database();
const el=id=>document.getElementById(id);


const AWARD_DEFS = [
  {icon:"🥂", title:"Le/la plus gros(se) fêtard(e)", qs:[1,3,9,16,25,26,37]},
  {icon:"⏰", title:"Le/la plus chaotique", qs:[0,6,13,23,40]},
  {icon:"😂", title:"La pile électrique du groupe", qs:[15,17,36,39]},
  {icon:"😈", title:"Le/la plus dangereux(se) en soirée", qs:[5,8,18,19,26,27]},
  {icon:"❤️", title:"Le/la plus love", qs:[28,29,30,41]},
  {icon:"👴", title:"Le/la daron/maman du groupe", qs:[10,11,12,24,31]},
  {icon:"🌍", title:"L’aventurier/ère FFY", qs:[32,33,35,40]}
];

function calcAward(arr, questionIndexes){
  const scores={};
  arr.forEach(s=>{
    questionIndexes.forEach(qi=>{
      const a=s.answers?.[qi];
      if(a) scores[a]=(scores[a]||0)+1;
    });
  });
  const ranked=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  if(!ranked.length) return {winners:[],score:0,total:0};
  const max=ranked[0][1];
  const winners=ranked.filter(([_,score])=>score===max).map(([name])=>name);
  const total=ranked.reduce((sum,[_,score])=>sum+score,0);
  return {winners,score:max,total};
}

function calcLegend(arr){
  const scores={};
  arr.forEach(s=>{
    questions.forEach((_,qi)=>{
      if(qi===38) return; // question Julien obligatoire exclue
      const a=s.answers?.[qi];
      if(a) scores[a]=(scores[a]||0)+1;
    });
  });
  const ranked=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  if(!ranked.length) return [];
  const max=ranked[0][1];
  return ranked.filter(([_,score])=>score===max).map(([name])=>name);
}

function awardsHTML(arr, liveMode=false){
  let html = `<div class="awards-wrap">
    <div class="center" style="margin-bottom:16px">
      <div class="big">🏆</div>
      <h2 style="margin-bottom:6px">LES AWARDS FFY</h2>
      <p class="note">${liveMode ? "Classement provisoire en direct" : "Le palmarès final du groupe"}</p>
    </div>`;

  AWARD_DEFS.forEach(a=>{
    const r=calcAward(arr,a.qs);
    const pct=r.total ? Math.round(r.score/r.total*100) : 0;
    html += `<div class="result-card award-card">
      <div style="font-size:34px">${a.icon}</div>
      <h3 style="font-size:21px;margin:8px 0 4px">${a.title}</h3>`;
    if(!r.winners.length){
      html += `<div class="small">Pas encore assez de votes.</div>`;
    } else {
      html += `<div class="award-winner">${r.winners.join(" & ")}</div>
      <div class="small" style="margin-top:6px">${pct}% des nominations de cette catégorie</div>`;
    }
    html += `</div>`;
  });

  const legends=calcLegend(arr);
  html += `<div class="result-card legend-card">
    <div style="font-size:52px">🏆</div>
    <h2 style="margin:6px 0">LA LÉGENDE FFY</h2>`;
  if(!legends.length){
    html += `<div class="small">Pas encore assez de votes.</div>`;
  } else {
    html += `<div class="legend-winner">${legends.join(" & ")}</div>
    <p class="note">La personne la plus souvent citée sur l’ensemble du questionnaire.</p>`;
  }
  html += `</div></div>`;
  return html;
}


if(!allowed){
  el('gate').innerHTML=`<div class="center">
    <div class="big">🔒</div>
    <h2>Termine d’abord le quiz</h2>
    <p class="note">Les résultats sont visibles uniquement après avoir répondu à toutes les questions.</p>
    <a class="btn primary" href="index.html" style="display:block;margin-top:16px">Retour au quiz</a>
  </div>`;
} else {
  el('gate').classList.add('hidden');
  el('content').classList.remove('hidden');
  db.ref('ffy2026/submissions').on('value',s=>render(s.val()||{}));
}

function render(subs){
  const arr=Object.values(subs||{}).filter(s=>s.completed===true);
  const n=arr.length;

  el('summary').innerHTML=`<h2>${n} participant${n>1?'s':''} a${n>1?'ont':' '} terminé</h2>`;
  el('awards').innerHTML=awardsHTML(arr,false);

  let html='';
  questions.forEach((q,qi)=>{
    const counts={};
    arr.forEach(s=>{
      const a=s.answers?.[qi];
      if(a) counts[a]=(counts[a]||0)+1;
    });
    const ranked=Object.entries(counts).sort((a,b)=>b[1]-a[1]);

    html+=`<div class="result-card"><h3>${qi+1}. ${q.text}</h3>`;
    if(!ranked.length){
      html+=`<div class="small">Pas encore de résultat final.</div>`;
    } else {
      ranked.forEach(([name,c])=>{
        const pct=n?Math.round(c/n*100):0;
        html+=`<div class="row"><span>${name}</span><strong>${c} · ${pct}%</strong></div>
               <div class="bar"><span style="width:${pct}%"></span></div>`;
      });
    }
    html+='</div>';
  });
  el('details').innerHTML=html;
}
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Résultats en direct — Qui est le plus ?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="big">📊🏆</div>
    <h1>Résultats en direct</h1>
    <p>Les votes se mettent à jour automatiquement</p>
  </div>

  <section class="card">
    <div id="summary"></div>
    <div id="results"></div>
    <div class="center" style="margin-top:20px">
      <a href="index.html">← Retour au questionnaire</a>
    </div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="data.js"></script>
<script>
const {participants,questions}=window.QUIZ_DATA;
const firebaseReady=window.FIREBASE_CONFIG &&
  window.FIREBASE_CONFIG.apiKey &&
  window.FIREBASE_CONFIG.databaseURL;

let db=null;
if(firebaseReady){
  firebase.initializeApp(window.FIREBASE_CONFIG);
  db=firebase.database();
}

const el=id=>document.getElementById(id);

function renderFrom(subs){
  const arr=Object.values(subs||{});
  const n=arr.length;

  el('summary').innerHTML =
    `<h2>${n} participant${n>1?'s':''} a${n>1?'ont':' '} voté</h2>` +
    `<p class="note">${
      firebaseReady
        ? '🟢 Résultats synchronisés en direct'
        : '⚠️ Firebase n’est pas encore connecté : seuls les votes de ce téléphone sont visibles.'
    }</p>`;

  const categoryWins={};
  participants.forEach(p=>categoryWins[p]=0);

  let detail='';
  questions.forEach((q,qi)=>{
    const counts={};
    arr.forEach(s=>{
      const a=s.answers?.[qi];
      if(a) counts[a]=(counts[a]||0)+1;
    });

    const ranked=Object.entries(counts).sort((a,b)=>b[1]-a[1]);

    if(ranked.length){
      const max=ranked[0][1];
      ranked.filter(x=>x[1]===max).forEach(x=>categoryWins[x[0]]++);
    }

    detail+=`<div class="result-card"><h3>${qi+1}. ${q.text}</h3>`;
    if(!ranked.length){
      detail+=`<div class="small">Pas encore de vote.</div>`;
    } else {
      ranked.forEach(([name,c])=>{
        const pct=n?Math.round(c/n*100):0;
        detail+=`
          <div class="row"><span>${name}</span><strong>${c} · ${pct}%</strong></div>
          <div class="bar"><span style="width:${pct}%"></span></div>`;
      });
    }
    detail+='</div>';
  });

  const podium=Object.entries(categoryWins)
    .sort((a,b)=>b[1]-a[1])
    .filter(x=>x[1]>0)
    .slice(0,3);

  let top='';
  if(podium.length){
    const medals=['🥇','🥈','🥉'];
    top=`<h2>Classement général</h2>
      <div class="podium">
        ${podium.map((x,i)=>`
          <div>
            <div class="big">${medals[i]}</div>
            <strong>${x[0]}</strong>
            <div class="small">${x[1]} catégorie${x[1]>1?'s':''} remportée${x[1]>1?'s':''}</div>
          </div>`).join('')}
      </div>
      <h2>Détail des questions</h2>`;
  }

  el('results').innerHTML=top+detail;
}

if(db){
  // Mise à jour automatique à chaque nouveau vote
  db.ref('ffy2026/submissions').on('value', snap => renderFrom(snap.val()||{}));
}else{
  renderFrom(JSON.parse(localStorage.getItem('quiz_submissions')||'{}'));
}
</script>
</body>
</html>

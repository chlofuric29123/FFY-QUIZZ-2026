<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Résultats finaux — FFY</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><div class="hero"><div class="big">🏆🎉</div><h1>Résultats FFY</h1><p>Résultats finaux</p></div><section class="card"><div id="gate"></div><div id="summary"></div><div id="results"></div><div class="center" style="margin-top:20px"><a href="index.html">← Retour au questionnaire</a></div></section></div>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script><script src="firebase-config.js"></script><script src="data.js"></script>
<script>
const {questions}=window.QUIZ_DATA;const allowed=localStorage.getItem('ffy_completed')==='true';firebase.initializeApp(window.FIREBASE_CONFIG);const db=firebase.database();const el=id=>document.getElementById(id);
if(!allowed){el('gate').innerHTML='<div class="center"><div class="big">🔒</div><h2>Termine d’abord le quiz</h2><p class="note">Les participants voient les résultats seulement après avoir terminé.</p><a class="btn primary" href="index.html" style="display:block;margin-top:16px">Retour au quiz</a></div>'}else{el('gate').classList.add('hidden');db.ref('ffy2026/submissions').on('value',s=>render(s.val()||{}))}

function render(subs){
  const arr=Object.values(subs||{}).filter(s=>s.completed===true);
  const n=arr.length;
  el('summary').innerHTML=`<h2>${n} participant${n>1?'s':''} a${n>1?'ont':' '} terminé</h2>`;

  let html='';
  let awards=[];

  questions.forEach((q,qi)=>{
    const counts={};
    arr.forEach(s=>{
      const a=s.answers?.[qi];
      if(a) counts[a]=(counts[a]||0)+1;
    });

    const ranked=Object.entries(counts).sort((a,b)=>b[1]-a[1]);

    html+=`<div class="result-card"><h3>${qi+1}. ${q.text}</h3>`;

    if(!ranked.length){
      html+=`<div class="small">Pas encore de résultat final.</div>`;
      awards.push({question:q.text,winners:[],pct:0});
    }else{
      const max=ranked[0][1];
      const winners=ranked.filter(([_,c])=>c===max).map(([name])=>name);
      const pct=n?Math.round(max/n*100):0;
      awards.push({question:q.text,winners,pct});

      ranked.forEach(([name,c])=>{
        const p=n?Math.round(c/n*100):0;
        html+=`<div class="row"><span>${name}</span><strong>${c} · ${p}%</strong></div>
               <div class="bar"><span style="width:${p}%"></span></div>`;
      });
    }

    html+='</div>';
  });

  let awardsHtml=`<div style="margin-top:28px">
    <div class="center">
      <div class="big">🏆</div>
      <h2>Les Awards FFY</h2>
      <p class="note">Le palmarès final du groupe</p>
    </div>`;

  awards.forEach((a,i)=>{
    awardsHtml+=`<div class="result-card">
      <div class="small">Award ${i+1}</div>
      <h3>${a.question}</h3>`;

    if(!a.winners.length){
      awardsHtml+=`<div class="small">Pas encore de gagnant.</div>`;
    }else{
      awardsHtml+=`<div style="font-size:22px;font-weight:900;margin-top:8px">
        🏆 ${a.winners.join(' & ')}
      </div>
      <div class="small" style="margin-top:6px">${a.pct}% des votes</div>`;
    }

    awardsHtml+='</div>';
  });

  awardsHtml+='</div>';

  el('results').innerHTML=html+awardsHtml;
}

</script></body></html>
